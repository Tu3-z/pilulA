<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — pílula*</title>
  <meta name="theme-color" content="#0B153D">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=Instrument+Serif:ital@0;1&family=Silkscreen:wght@400;700&family=VT323&display=swap">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/forms.css">
  <link rel="stylesheet" href="assets/css/entrar.css">
</head>
<body data-page="entrar">
  <a class="skip" href="#conteudo">Pular para o conteúdo</a>
  <div id="site-header"></div>

  <main id="conteudo" class="logon sky">
    <div class="container logon__grid">
      <div class="logon__copy">
        <p class="eyebrow eyebrow--light">minha conta</p>
        <h1 class="h1 h1--light">Bem-vind<b class="px px--light">o</b><br>de volta<span class="star star--light">*</span></h1>
        <p class="logon__lead">Entra pra acompanhar pedidos, guardar suas receitas e comprar mais rápido.</p>
        <p class="logon__note term">protótipo: a conta fica salva só neste navegador.</p>
      </div>

      <div class="win logon__win">
        <div class="win__bar">
          <span class="win__title">Logon — pílula98</span>
          <span class="win__ctls" aria-hidden="true"><span class="win__ctl">?</span><span class="win__ctl">×</span></span>
        </div>

        <div class="logon__head">
          <svg class="logon__key" width="52" height="52" viewBox="0 0 16 16" aria-hidden="true" shape-rendering="crispEdges">
            <path fill="#121216" d="M5 1h6v1h1v5h-2V3H6v4H4V2h1z"/>
            <path fill="#121216" d="M2 7h12v8H2z"/>
            <path fill="#E9E0C6" d="M3 8h10v6H3z"/>
            <path fill="#2340B8" d="M7 9h2v2h-1v2H7v-2H7z"/>
            <path fill="#2340B8" d="M7 9h2v2H7zM7 11h1v2H7z"/>
          </svg>
          <p>Digite seus dados para entrar na pílula* ou crie uma conta nova.</p>
        </div>

        <div class="tabs__list logon__tabs" role="tablist" aria-label="Entrar ou criar conta">
          <button class="tabs__tab" role="tab" id="tab-entrar" aria-controls="painel-entrar" aria-selected="true">Entrar</button>
          <button class="tabs__tab" role="tab" id="tab-criar" aria-controls="painel-criar" aria-selected="false" tabindex="-1">Criar conta</button>
        </div>

        <!-- ENTRAR -->
        <section class="tabs__panel logon__panel" role="tabpanel" id="painel-entrar" aria-labelledby="tab-entrar">
          <form class="form" data-form-entrar novalidate>
            <div class="form-field">
              <label class="label" for="login-email">E-mail</label>
              <input class="field" id="login-email" name="email" type="email" autocomplete="email" required>
            </div>
            <div class="form-field">
              <label class="label" for="login-senha">Senha</label>
              <div class="pass">
                <input class="field" id="login-senha" name="senha" type="password" autocomplete="current-password" required>
                <button type="button" class="win__btn pass__toggle" data-mostrar="login-senha" aria-pressed="false">mostrar</button>
              </div>
            </div>
            <p class="form-alert term" data-erro-entrar role="alert" hidden></p>
            <div class="form__actions">
              <button type="button" class="link-btn" data-esqueci>Esqueci minha senha</button>
              <button type="submit" class="btn btn--primary">Entrar</button>
            </div>
            <p class="form-msg term" data-esqueci-msg aria-live="polite"></p>
          </form>
        </section>

        <!-- CRIAR CONTA -->
        <section class="tabs__panel logon__panel" role="tabpanel" id="painel-criar" aria-labelledby="tab-criar" hidden>
          <form class="form" data-form-criar novalidate>
            <div class="form-grid">
              <div class="form-field form-field--full">
                <label class="label" for="cad-nome">Nome completo</label>
                <input class="field" id="cad-nome" name="nome" autocomplete="name" required>
              </div>
              <div class="form-field">
                <label class="label" for="cad-cpf">CPF</label>
                <input class="field" id="cad-cpf" name="cpf" inputmode="numeric" placeholder="000.000.000-00" required>
              </div>
              <div class="form-field">
                <label class="label" for="cad-cel">Celular</label>
                <input class="field" id="cad-cel" name="celular" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="(11) 90000-0000" required>
              </div>
              <div class="form-field form-field--full">
                <label class="label" for="cad-email">E-mail</label>
                <input class="field" id="cad-email" name="email" type="email" autocomplete="email" required>
              </div>
              <div class="form-field">
                <label class="label" for="cad-senha">Senha</label>
                <div class="pass">
                  <input class="field" id="cad-senha" name="senha" type="password" autocomplete="new-password" aria-describedby="forca-txt" required>
                  <button type="button" class="win__btn pass__toggle" data-mostrar="cad-senha" aria-pressed="false">mostrar</button>
                </div>
                <div class="strength" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
                <p class="field-hint" id="forca-txt" data-forca>mín. 8 caracteres</p>
              </div>
              <div class="form-field">
                <label class="label" for="cad-senha2">Confirmar senha</label>
                <input class="field" id="cad-senha2" name="senha2" type="password" autocomplete="new-password" required>
              </div>
              <div class="form-field form-field--full">
                <label class="check-row"><input type="checkbox" id="cad-termos" name="termos" required> <span>Li e aceito os <a href="#">termos de uso</a> e a <a href="#">política de privacidade</a> (LGPD).</span></label>
              </div>
              <div class="form-field form-field--full">
                <label class="check-row"><input type="checkbox" name="ofertas"> <span>Quero receber ofertas por e-mail. Sem spam, só cuidado.</span></label>
              </div>
            </div>
            <p class="form-alert term" data-erro-criar role="alert" hidden></p>
            <div class="form__actions">
              <span></span>
              <button type="submit" class="btn btn--primary">Criar conta</button>
            </div>
          </form>
        </section>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script type="module" src="assets/js/pages/entrar.js"></script>
</body>
</html>
