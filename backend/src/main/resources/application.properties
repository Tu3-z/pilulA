spring.application.name=pilula

# --------------------------------------------------------------------------
# Banco: PostgreSQL no Supabase.
# Os dados de acesso NÃO ficam aqui (este arquivo vai para o GitHub).
# Eles ficam no arquivo backend/.env, que é ignorado pelo Git.
# Copie o backend/.env.example para backend/.env e preencha.
# --------------------------------------------------------------------------
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# --------------------------------------------------------------------------
# Tabelas: quem cria e atualiza é o Flyway, pelas migrations em
#   src/main/resources/db/migration  (V1 tabelas, V2 dados)
#   src/main/resources/db/supabase   (V3 segurança, só no Supabase)
# O Hibernate não mexe na estrutura do banco.
# --------------------------------------------------------------------------
spring.flyway.locations=classpath:db/migration,classpath:db/supabase
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# mostra o SQL no console (bom pra aprender; desligue se poluir demais)
spring.jpa.show-sql=true
