spring.application.name=pilula

# --------------------------------------------------------------------------
# Porta: Railway e Render injetam a variável PORT automaticamente.
# Em desenvolvimento local continua na 8080.
# --------------------------------------------------------------------------
server.port=${PORT:8080}

# O Railway recebe em HTTPS e repassa para a API em HTTP, avisando nos cabeçalhos
# X-Forwarded-*. Sem isto, o Spring acha que está em http:// e o Scalar tenta baixar
# a documentação por http:// numa página https:// — o navegador bloqueia e aparece
# "Document 'api-1' could not be loaded".
server.forward-headers-strategy=framework

# --------------------------------------------------------------------------
# Banco: PostgreSQL no Supabase.
# Os dados de acesso NÃO ficam aqui (este arquivo vai para o GitHub).
# Em desenvolvimento: copie backend/.env.example para backend/.env e preencha.
# Em produção (Railway / Render): configure as variáveis de ambiente no painel.
# --------------------------------------------------------------------------
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# --------------------------------------------------------------------------
# Flyway: as duas pastas sempre, em qualquer ambiente.
# A "supabase" tem as migrations de RLS (V3, V5, V7). Elas já constam como
# aplicadas no banco (tabela flyway_schema_history), então o Flyway NÃO roda de
# novo; mas se a pasta sumir daqui, ele acusa "applied migration not resolved
# locally" e a API não sobe.
# --------------------------------------------------------------------------
spring.flyway.locations=classpath:db/migration,classpath:db/supabase
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# mostra o SQL no console (bom pra aprender; desligue em produção se poluir demais)
spring.jpa.show-sql=${SHOW_SQL:true}

# --------------------------------------------------------------------------
# JWT: a chave vem do .env (local) ou da variável de ambiente (produção).
# Precisa ter pelo menos 32 caracteres (HMAC-SHA256). Expiração padrão: 24h.
# --------------------------------------------------------------------------
jwt.secret=${JWT_SECRET}
jwt.expiracao-ms=${JWT_EXPIRACAO_MS:86400000}

# Bootstrap opcional do primeiro administrador. Remova as duas variáveis após criar a conta.
admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}
admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}

# --------------------------------------------------------------------------
# Mercado Pago Checkout Pro. O token de acesso fica somente no backend.
# Para testes, use as credenciais de teste da sua aplicação no painel do MP.
# --------------------------------------------------------------------------
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
frontend.url=${FRONTEND_URL:http://localhost:5500}

# --------------------------------------------------------------------------
# CORS: origens permitidas, separadas por vírgula.
# Em desenvolvimento o padrão do CorsConfig já cobre localhost:5500.
# Em produção, defina CORS_ORIGINS com a URL do Vercel.
# --------------------------------------------------------------------------
# CORS_ORIGINS=https://seu-projeto.vercel.app
