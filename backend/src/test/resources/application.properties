# Testes rodam num banco H2 em memória (em modo PostgreSQL), sem internet e
# sem mexer no Supabase. As migrations V1 e V2 são as mesmas do banco real;
# a V3 (RLS) é só do Supabase e fica de fora.
spring.datasource.url=jdbc:h2:mem:pilula;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=none
