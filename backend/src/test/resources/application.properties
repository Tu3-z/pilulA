# Testes rodam num banco H2 em memória, sem internet e sem mexer no Supabase.
# A migration de usuário usa o tipo PostgreSQL TIMESTAMPTZ, mapeado aqui para o tipo equivalente do H2.
spring.datasource.url=jdbc:h2:mem:pilula;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE DOMAIN IF NOT EXISTS TIMESTAMPTZ AS TIMESTAMP WITH TIME ZONE
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=none

# chave só para os testes (não é usada em lugar nenhum de verdade)
jwt.secret=chave-de-teste-chave-de-teste-chave-de-teste
