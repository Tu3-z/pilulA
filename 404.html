<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada — pílula*</title>
  <meta name="theme-color" content="#152A7E">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <style>
    /* "tela azul" do Windows 98 */
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--blue-ink); color: #E8ECFA; font-family: var(--f-term); font-size: clamp(1.3rem, 2.4vw, 1.7rem); line-height: 1.25; }
    main { width: min(720px, calc(100% - 32px)); padding-block: 48px; }
    h1 { display: table; margin: 0 auto 1.5em; padding: 0 .4em; background: #E8ECFA; color: var(--blue-ink); font-weight: 400; font-size: 1em; }
    p { margin: 0 0 1em; }
    a { color: #fff; }
    .center { text-align: center; }
    .blink { animation: b 1s steps(2) infinite; }
    @keyframes b { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
  </style>
</head>
<body>
  <main>
    <h1>pílula*</h1>
    <p>Ocorreu um erro 404 em <b>PÁGINA.EXE</b>. A página que você procurou não existe, mudou de lugar ou foi tomar um remédio.</p>
    <p>* Pressione qualquer tecla para voltar à página inicial.<br>
       * Ou <a href="loja.html">abra a loja</a> e procure de novo.</p>
    <p class="center">Pressione qualquer tecla para continuar <span class="blink">_</span></p>
  </main>
  <script>
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Tab' || e.key === 'Shift') return; // deixa navegar pelo teclado
      if (e.key === 'Enter' && document.activeElement && document.activeElement.tagName === 'A') return;
      location.href = 'index.html';
    });
  </script>
</body>
</html>
