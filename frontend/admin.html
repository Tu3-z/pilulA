<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Administração — pílula*</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B153D">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=Silkscreen:wght@400;700&family=VT323&display=swap">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/pages/painel.css">
  <link rel="stylesheet" href="assets/css/pages/receitas-admin.css">
  <script src="assets/js/config.js"></script>
  <script type="module" src="assets/js/pages/admin.js"></script>
</head>
<body data-pagina="admin">
  <a class="skip" href="#conteudo">Pular para o conteúdo</a>
  <div id="topo"></div>
  <main id="conteudo" class="container panel" tabindex="-1">
    <header class="panel__head">
      <p class="eyebrow">Administração</p>
      <h1 class="h1">Painel<span class="star">*</span></h1>
      <p>Gerencie contas e revise receitas médicas enviadas pelos clientes.</p>
    </header>

    <!-- Abas -->
    <nav class="admin-tabs" aria-label="Seções do painel">
      <button class="admin-tab admin-tab--active" data-aba="contas" type="button">👥 Contas</button>
      <button class="admin-tab" data-aba="receitas" type="button">
        🧾 Receitas
        <span class="admin-badge" id="badge-pendentes" hidden>0</span>
      </button>
    </nav>

    <!-- === ABA: CONTAS === -->
    <section class="win panel__box admin-panel" id="painel-contas" aria-labelledby="contas-titulo">
      <div class="win__bar"><span class="win__title" id="contas-titulo">Usuários cadastrados</span></div>
      <p class="panel__status term" id="status" role="status" aria-live="polite">Carregando…</p>
      <div class="panel__table-wrap">
        <table class="panel__table">
          <thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Ação</th></tr></thead>
          <tbody id="usuarios"></tbody>
        </table>
      </div>
    </section>

    <!-- === ABA: RECEITAS === -->
    <section class="win panel__box admin-panel" id="painel-receitas" aria-labelledby="rec-titulo" hidden>
      <div class="win__bar"><span class="win__title" id="rec-titulo">Receitas médicas enviadas</span></div>
      <div class="receitas-filtros">
        <button class="win__btn receitas-filtro--active" data-filtro="PENDENTE" type="button">Pendentes</button>
        <button class="win__btn" data-filtro="APROVADA" type="button">Aprovadas</button>
        <button class="win__btn" data-filtro="REJEITADA" type="button">Rejeitadas</button>
        <button class="win__btn" data-filtro="TODAS" type="button">Todas</button>
      </div>
      <p class="panel__status term" id="rec-status" role="status" aria-live="polite">Carregando…</p>
      <div class="receitas-grid" id="receitas-grid"></div>
    </section>

    <!-- Modal de visualização da receita -->
    <dialog class="receita-modal" id="receita-modal" aria-labelledby="modal-titulo">
      <div class="receita-modal__inner">
        <div class="win__bar">
          <span class="win__title" id="modal-titulo">Foto da receita</span>
          <button class="win__ctl" type="button" id="modal-fechar" aria-label="Fechar">×</button>
        </div>
        <div class="receita-modal__body">
          <img class="receita-modal__img" id="modal-img" src="" alt="Foto da receita médica" loading="lazy">
        </div>
        <div class="receita-modal__acao" id="modal-acao">
          <label class="sr-only" for="modal-obs">Observação (opcional)</label>
          <textarea class="field receita-modal__obs" id="modal-obs" placeholder="Observação para o cliente (opcional)…" rows="2" maxlength="300"></textarea>
          <div class="receita-modal__btns">
            <button class="btn btn--primary" type="button" id="modal-aprovar">✅ Aprovar receita</button>
            <button class="btn" type="button" id="modal-rejeitar" style="background:var(--alert);color:#fff">❌ Rejeitar receita</button>
          </div>
          <p class="receita-modal__res" id="modal-res" role="status" aria-live="polite"></p>
        </div>
      </div>
    </dialog>

  </main>
  <div id="rodape"></div>
</body>
</html>
